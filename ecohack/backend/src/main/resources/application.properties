spring.application.name=backend
server.address=0.0.0.0
server.port=8081

# ---- Azure Blob Storage ----
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:}
azure.storage.container-name=task-images

# ---- Azure AI Vision ----
# Leave blank to use mock analysis (always approves). Set both to enable real vision checks.
azure.vision.endpoint=${AZURE_VISION_ENDPOINT:}
azure.vision.key=${AZURE_VISION_KEY:}
azure.vision.api-version=2023-02-01-preview
azure.vision.features=tags,description,objects
